<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก - Wondersport x Icecool</title>
  
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .register-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 40px 32px;
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(14, 116, 144, 0.08);
      border: 2px solid #e2e8f0;
    }

    .header-badge {
      background-color: #1d4ed8;
      color: #ffffff;
      text-align: center;
      padding: 16px 28px;
      border-radius: 50px;
      margin-bottom: 28px;
      box-shadow: 0 8px 16px rgba(29, 78, 216, 0.2);
    }

    .header-badge h2 {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .header-badge p {
      font-size: 0.85rem;
      font-weight: 300;
      opacity: 0.9;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: #334155;
      padding-left: 12px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #1d4ed8;
      font-size: 1.1rem;
    }

    .form-control {
      width: 100%;
      padding: 12px 20px 12px 48px;
      border: 2px solid #cbd5e1;
      border-radius: 30px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      background-color: #ffffff;
    }

    .form-control:focus {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.15);
    }

    .btn-submit {
      width: 100%;
      background-color: #1d4ed8;
      color: #ffffff;
      padding: 14px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 6px 14px rgba(29, 78, 216, 0.25);
    }

    .btn-submit:hover {
      background-color: #1e40af;
      transform: translateY(-1px);
    }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #64748b;
    }

    .footer-link a {
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="header-badge">
      <h2>สมัครสมาชิก</h2>
      <p>Wondersport x Icecool System</p>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label for="fullname">ชื่อ - นามสกุลจริง (สำหรับยืนยันสิทธิ์)</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="fullname" class="form-control" placeholder="นาย/นางสาว สมชาย ใจดี" required>
        </div>
      </div>

      <div class="form-group">
        <label for="phone">เบอร์โทรศัพท์ติดต่อ</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-phone"></i>
          <input type="tel" id="phone" class="form-control" placeholder="08X-XXX-XXXX" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">อีเมล</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" class="form-control" placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-user-plus"></i> ยืนยันการสมัครสมาชิก
      </button>
    </form>

    <div class="footer-link">
      มีบัญชีผู้ใช้งานแล้วใช่ไหม? <a href="login.html">เข้าสู่ระบบที่นี่</a>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBkkSnIQXH32pp87la02ox2IQwynNRjt2U",
      authDomain: "wondersport-icecool.firebaseapp.com",
      projectId: "wondersport-icecool",
      storageBucket: "wondersport-icecool.firebasestorage.app",
      messagingSenderId: "1096837120033",
      appId: "1:1096837120033:web:27a4d91176865744ada360",
      measurementId: "G-8ZGW9XP6VJ"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const fullname = document.getElementById('fullname').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          return database.ref('users/' + user.uid).set({
            fullname: fullname,
            phone: phone,
            email: email,
            role: 'user',
            createdAt: new Date().toISOString()
          });
        })
        .then(() => {
          alert('สมัครสมาชิกสำเร็จเรียบร้อย!');
          window.location.href = 'login.html';
        })
        .catch((error) => {
          console.error("Error: ", error);
          alert('เกิดข้อผิดพลาด: ' + error.message);
        });
    });
  </script>
</body>
</html>
